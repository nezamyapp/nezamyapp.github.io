function fromB64(text){
  return Uint8Array.from(atob(text), char=>char.charCodeAt(0));
}
async function pageKey(fragment, usage){
  if(!/^[A-Za-z0-9_-]{43}$/.test(fragment)) throw Error("مفتاح الصفحة مش كامل.");
  const raw = fromB64(fragment.replace(/-/g,"+").replace(/_/g,"/"));
  return crypto.subtle.importKey("raw",raw,{name:"AES-GCM",length:256},false,[usage]);
}
async function decryptText(key, box){
  const iv = fromB64(box.iv);
  if(box.v!==1 || iv.length!==12) throw Error("صيغة الملف المشفّر مش مدعومة.");
  const bytes = await crypto.subtle.decrypt({name:"AES-GCM",iv}, key, fromB64(box.ct));
  return new TextDecoder("utf-8",{fatal:true}).decode(bytes);
}
async function decryptPage(fragment, box){
  return decryptText(await pageKey(fragment,"decrypt"),box);
}
async function openPage(box){
  try{
    const html = await decryptPage(location.hash.slice(1),box);
    document.open();
    document.write(html);
    document.close();
  }catch{
    document.getElementById("link-error").hidden=false;
  }
}
